[package]
name = "twocb"
version = "0.1.0"
authors = ["coral <jonas@jonasbengtson.se>"]
edition = "2024"
license = "MIT"

[dependencies]
actix-web = "4.13"
anyhow = "1.0"
atomic-counter = "1.0"
aubio = { version = "0.2.1", features = ["bindgen"] }
clap = { version = "4.6", features = ["derive"] }
cpal = "0.17"
crossbeam = "0.8"
crossbeam-channel = "0.5"
futures = "0.3"
glob = "0.3"
lazy_static = "1.5"
log = "0.4"
notify = "8.0"
pretty_env_logger = "0.5"
rustchord = "0.6.0"
v8 = "146"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_derive = "1.0"
serde_json = "1.0"
sled = "0.34"
tokio = { version = "1.50", features = ["full"] }
vecmath = "1.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
midir = "0.10"
async-trait = "0.1"
thiserror = "2.0"
midimapper = { git = "https://github.com/coral/midimapper.git" }
